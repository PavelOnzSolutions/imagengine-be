type Query {
    transform(input: TransformerInput!): TransformResult
    convert(input: ConverterInput!): ConverterResult
    histogram(input: SourceInput!): [HistogramResult]
    search(input: SearchInput!): SearchResult
}

input TransformerInput {
    from: FromInput!
    to: ToInput!
}

input ConverterInput {
    from: SourceInput!
    to: ToInput!
}

input SearchInput {
    what: WhatInput!
    where: WhereInput!
}

input WhatInput {
    object: String!
    probability: Float
}

input WhereInput {
    image: String!
}

input FromInput {
    image: String!
    transformers: [Transformers!]!
    resize: ResizeInput
    crop: CropInput
    rotate: RotateInput
    stitch: StitchInput
    sticker: StickerInput
    watermark: WatermarkInput
    grayscale: Boolean
    sepia: Boolean
    cumulativeSink: Boolean
}

input SourceInput {
    images: [String!]!
}

input ResizeInput {
    width: Int!
    height: Int!
    sink: Boolean
}

input CropInput {
    x: Int!
    y: Int!
    width: Int!
    height: Int!
}

input RotateInput {
    angle: Int!
}

input StitchInput {
    images: [String!]!
    direction: StitchDirection!
}

input StickerInput {
    image: String!
    x: Int
    y: Int
    width: Int
    height: Int
}

input WatermarkInput {
    image: String!
    x: Int
    y: Int
    width: Int
    height: Int
}

input ToInput {
    format: Format!
    quality: Int
}

type TransformResult {
    success: Boolean!
    message: String
    url: String
}

type ConverterResult {
    success: Boolean!
    message: String
    urls: [String]
}

type HistogramResult {
    image: String!
    histogram: [Int!]!
    url: String!
}

type SearchResult {
    success: Boolean!
    message: String
    markedImage: String
    coordinates: [PlanarCoordinates]
}

type PlanarCoordinates {
    x: Int!
    y: Int!
}

enum Format {
    JPEG
    PNG
    WEBP
    GIF
    TIFF
    BMP
}

enum StitchDirection {
    HORIZONTAL
    VERTICAL
}

enum Transformers {
    RESIZE
    CROP
    ROTATE
    STITCH
    STICKER
    GRAYSCALE
    SEPIA
    WATERMARK
}